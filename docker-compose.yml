version: "3.8"

services:
  # PostgreSQL
  postgres:
    image: postgres:15
    container_name: swt_postgres
    ports:
      - "5432:5432"
    volumes:
      - ~/switchswitch/docker/postgres:/home/postgres
    working_dir: /home/postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

  # DynamoDB
  dynamodb:
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    image: amazon/dynamodb-local:latest
    container_name: swt_dynamodb
    ports:
      - "8000:8000"
    volumes:
      - ~/switchswitch/docker/dynamodb:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal

  # Kafka
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: swt_zookeeper
    ports:
      - "2181:2181"
  kafka:
    image: wurstmeister/kafka:latest
    container_name: swt_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: 127.0.0.1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    volumes:
      - ~/switchswitch/docker/kafka:/home/kafka
